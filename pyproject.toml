[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-flight-planner"
version = "0.1.0"
description = "KML to multi-drone QGroundControl plan generator"
requires-python = ">=3.10"
# These were undeclared until 13 Oct 2026: the workstation's venv happened to contain
# them from months of ad-hoc installs, so `pip install -e .` on a fresh machine produced
# an environment in which every flight tool failed at `import pymavlink`. Declared now,
# because the repo is meant to be clonable onto a laptop and simply work.
dependencies = [
    "pymavlink>=2.4",    # every agent, relay and orchestration tool
    "PyYAML>=6",         # fleet files, companions.yaml, artex-registry.yaml
]

[project.optional-dependencies]
# Planning and visualisation only -- the flight path does not need these, so a field
# laptop can skip them.
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7"]

[project.scripts]
flight-planner = "flight_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flight_planner = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The workstation sources the ROS 2 Humble overlay, which puts launch_testing's pytest
# plugins on the path (entry points "launch_testing" and "launch_ros"). They import
# `lark` and register launch-only hooks, neither of which this venv has, so autoloading
# them crashes pytest before collection. They are irrelevant to these tests, and
# blocking a plugin name that is not installed is a no-op elsewhere.
addopts = "-p no:launch_testing -p no:launch_ros"
